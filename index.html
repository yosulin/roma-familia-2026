<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8c2f1b">
<title>Roma en Familia · 9-12 oct 2026</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <p class="eyebrow">S.P.Q.R. · Itinerarium Familiare</p>
    <h1>ROMA</h1>
    <p class="dates">9 — 12 OCT 2026</p>
  </div>
</header>

<nav class="view-switch" id="viewSwitch">
  <button class="view-btn is-active" data-view="itinerario">Itinerario</button>
  <button class="view-btn" data-view="mapa">Mapa</button>
  <button class="view-btn" data-view="lugares">Todos</button>
</nav>

<main id="app">

  <!-- ITINERARIO -->
  <section id="view-itinerario" class="view is-active">
    <div class="day-tabs" id="dayTabs"></div>
    <div class="milestone-track" id="itinerarioContent"></div>
  </section>

  <!-- MAPA -->
  <section id="view-mapa" class="view">
    <div class="filter-row" id="mapFilters"></div>
    <div id="map"></div>
  </section>

  <!-- TODOS LOS LUGARES -->
  <section id="view-lugares" class="view">
    <div class="filter-row" id="lugaresFilters"></div>
    <div class="places-grid" id="lugaresGrid"></div>
  </section>

</main>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-content" id="sheetContent"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
